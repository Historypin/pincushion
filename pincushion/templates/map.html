{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="leaflet/leaflet.css">
<link rel="stylesheet" href="leaflet/leaflet.markercluster/MarkerCluster.css">
<link rel="stylesheet" href="leaflet/leaflet.markercluster/MarkerCluster.Default.css">
<script src="leaflet/leaflet.js"></script>
<script src="leaflet/leaflet.markercluster/leaflet.markercluster.js"></script>
<script src="basemap.js"></script>
{% endblock %}

{% block style %}
<style>
#map {
  --sea: #dfe8ec;
  --land: #fbfbf8;
  --edge: #9aa5ab;
  width: 100%;
  height: 75vh;
  margin-top: 1rem;
  background: var(--sea);
}

@media (prefers-color-scheme: dark) {
  #map {
    --sea: #1d2a31;
    --land: #3a3f42;
    --edge: #7d878c;
  }
}

.leaflet-popup-content {
  font-family: var(--sans);
}
</style>
{% endblock %}

{% block main %}
<h1>Map</h1>
<div id="map"></div>
<script>
  let pins = {{ geojson | safe }};
  let map = L.map('map', {zoomSnap: 0.5, worldCopyJump: true});

  // The basemap is drawn from data in basemap.js, so the map works offline
  // and from a file.
  let colours = getComputedStyle(document.getElementById('map'));
  let colour = (name) => colours.getPropertyValue(name).trim();
  let basemap = window.PINCUSHION_BASEMAP;
  let credit = 'Coastlines and borders from <a href="https://www.naturalearthdata.com/">Natural Earth</a>';
  // its own pane below the tiles, so street tiles cover it when they load
  map.createPane('basemap');
  map.getPane('basemap').style.zIndex = 150;
  map.getPane('basemap').style.pointerEvents = 'none';
  L.geoJSON(basemap.land, {
    attribution: credit,
    pane: 'basemap',
    interactive: false,
    style: {stroke: true, color: colour('--edge'), weight: 0.6, fillColor: colour('--land'), fillOpacity: 1},
  }).addTo(map);
  L.geoJSON(basemap.lakes, {
    pane: 'basemap',
    interactive: false,
    style: {stroke: true, color: colour('--edge'), weight: 0.6, fillColor: colour('--sea'), fillOpacity: 1},
  }).addTo(map);
  L.geoJSON(basemap.borders, {
    pane: 'basemap',
    interactive: false,
    style: {color: colour('--edge'), weight: 0.6, dashArray: '2 3'},
  }).addTo(map);

  // When the archive is served and online, add OpenStreetMap's street-level
  // tiles on top. Their tile usage policy needs a Referer, which a page
  // opened from a file can't send, and requires this credit.
  let streets = location.protocol.startsWith('http') && navigator.onLine;
  if (streets) {
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);
  }

  let markers = L.markerClusterGroup();

  // build a popup's link as an element, so titles are shown as text
  let pinLink = (pin) => {
    let link = document.createElement('a');
    link.href = `../pins/${pin.properties.id}/index.html`;
    link.textContent = pin.properties.name;
    return link;
  };

  for (let pin of pins.features) {
    let [lng, lat] = pin.geometry.coordinates;
    let marker = L.marker([lat, lng], {title: pin.properties.name});
    marker.bindPopup(pinLink(pin));
    markers.addLayer(marker);
  }

  map.addLayer(markers);

  // position the map on a specific pin if one is in the URL
  let pinId = parseInt(window.location.hash.replace('#', ''));
  let target = pins.features.find((pin) => pin.properties.id === pinId);
  if (target) {
    let [lng, lat] = target.geometry.coordinates;
    // The offline basemap only has coastlines and borders, so show the pin
    // in its region; with street tiles, show its street.
    map.setView([lat, lng], streets ? 16 : 6);
    // ring the pin and open its popup, since it may be inside a cluster
    L.circleMarker([lat, lng], {radius: 16, color: colour('--edge'), weight: 3, fill: false})
      .addTo(map)
      .bindPopup(pinLink(target))
      .openPopup();
  } else if (pins.features.length) {
    map.fitBounds(markers.getBounds());
  } else {
    map.setView([20, 0], 2);
  }
</script>
{% endblock %}
