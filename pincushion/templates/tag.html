{% extends "base.html" %}
{% from "gallery.html" import pin_gallery %}

{% block breadcrumb %}
<nav class="breadcrumb" aria-label="Breadcrumb">
  <ol>
    <li><a href="index.html">Tags</a></li>
    <li>{{ tag }}</li>
  </ol>
</nav>
{% endblock %}

{% block main %}

<h1>{{ tag }}</h1>
<p class="count">{{ pins | length | plural("pin") }} tagged “{{ tag }}”</p>

{{ pin_gallery(pins, media, root) }}

{% endblock %}
