{% extends "base.html" %}

{% block main %}

<h1>Tags</h1>

<div class="tag-index">
  {% for letter, tags in tags_by_letter %}
  <h2>{{ letter }}</h2>
  <ul>
    {% for tag in tags %}
    <li>
      <a href="{{ tag_files[tag] | urlencode }}.html">{{ tag }}</a>
      <span class="count">{{ tag_index[tag] | length }}</span>
    </li>
    {% endfor %}
  </ul>
  {% endfor %}
</div>

{% endblock %}
