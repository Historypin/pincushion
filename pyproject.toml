[project]
name = "pincushion"
version = "0.6.0"
description = "An archiving tool for Historypin"
readme = "README.md"
requires-python = ">=3.11"
repository = "https://github.com/historypin/pincushion"
dependencies = [
    "requests>=2.34",
    "tqdm>=4.70",
    "click>=8.5",
    "jinja2>=3.1.6",
    # yt-dlp has to keep up with YouTube, so require a recent release; the
    # default extras include the JavaScript challenge solver YouTube needs
    "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
pincushion = "pincushion:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "mypy>=2.4",
    "types-requests>=2.33",
    "types-tqdm>=4.70",
    "hatch>=1.18",
    "responses>=0.26",
    "ruff==0.17.6",
]

[tool.hatch.build.targets.wheel]
packages = ["pincushion"]

# list what goes in the sdist, so archives and other local files sitting in
# the checkout can't end up in it
[tool.hatch.build.targets.sdist]
only-include = ["pincushion", "tests", "scripts", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = "."
log_cli = true

[[tool.mypy.overrides]]
module = ["yt_dlp"]
ignore_missing_imports = true

