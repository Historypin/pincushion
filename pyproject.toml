[project]
name = "pincushion"
version = "0.6.0"
description = "An archiving tool for Historypin"
readme = "README.md"
requires-python = ">=3.11"
repository = "https://github.com/historypin/pincushion"
dependencies = [
    "requests>=2.32.3",
    "tqdm>=4.66.5",
    "click>=8.1.7",
    "jinja2>=3.1.4",
    # yt-dlp has to keep up with YouTube, so require a recent release; the
    # default extras include the JavaScript challenge solver YouTube needs
    "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
pincushion = "pincushion:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "mypy>=1.11.2",
    "types-requests>=2.32.0.20240914",
    "types-tqdm>=4.66.0.20240417",
    "hatch>=1.13.0",
    "responses>=0.25",
    "ruff==0.17.6",
]

[tool.hatch.build.targets.wheel]
packages = ["pincushion"]

[tool.pytest.ini_options]
pythonpath = "."
log_cli = true

[[tool.mypy.overrides]]
module = ["yt_dlp"]
ignore_missing_imports = true

